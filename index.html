<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <base href="/">
  <script>
    // Immediate Auto-Redirect: If user already has an active verified session, jump directly to their room!
    (function() {
      try {
        const rawAuth = localStorage.getItem('headless_dice_auth') || sessionStorage.getItem('headless_dice_auth');
        if (rawAuth) {
          const auth = JSON.parse(rawAuth);
          if (auth && auth.key && auth.status === 'ACTIVE') {
            const roomParam = auth.roomId ? ('?room=' + encodeURIComponent(auth.roomId)) : '';
            window.location.replace('/app' + roomParam);
          }
        }
      } catch(e) {}
    })();
  </script>
  <title>🎃 HEADLESS DICE // HALLOWEEN ACCESS GATEWAY 🎃</title>
  <meta name="description" content="Headless Dice - Dedicated 1-Color Predictor & Probability Engine. Enter License Key to access your private prediction room.">
  <link rel="icon" type="image/png" href="/assets/headless_dice_logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Dedicated Cyberpunk Gateway Styles */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 20%, #17072b 0%, #06020c 70%);
      font-family: var(--font-main, 'Outfit', sans-serif);
      color: #f3e8ff;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
      position: relative;
      overflow-x: hidden;
    }

    .ambient-glow-top {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(ellipse at center, rgba(168, 85, 247, 0.25) 0%, rgba(168, 85, 247, 0) 70%);
      pointer-events: none;
      z-index: 0;
    }

    .gateway-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 490px;
    }

    .gateway-card {
      background: rgba(18, 7, 32, 0.82);
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(168, 85, 247, 0.15);
      backdrop-filter: blur(16px);
      text-align: center;
      position: relative;
    }

    .gateway-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 10%;
      right: 10%;
      height: 2px;
      background: linear-gradient(90deg, transparent, #a855f7, #ec4899, transparent);
    }

    .gateway-logo-wrap {
      width: 76px;
      height: 76px;
      margin: 0 auto 16px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(168, 85, 247, 0.3) 0%, rgba(10, 4, 18, 0.9) 75%);
      border: 2px solid rgba(192, 132, 252, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(168, 85, 247, 0.4);
      position: relative;
    }

    .gateway-logo-wrap img {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      object-fit: cover;
    }

    .gateway-title {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: 2px;
      margin: 0 0 6px 0;
      background: linear-gradient(135deg, #ffffff 30%, #c084fc 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }

    .gateway-badges {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .badge-cyber {
      background: rgba(168, 85, 247, 0.15);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: #c084fc;
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      padding: 4px 10px;
      border-radius: 20px;
      text-transform: uppercase;
    }

    .badge-sub {
      color: #94a3b8;
      font-size: 0.72rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    /* HWID Display Block */
    .hwid-box {
      background: rgba(9, 3, 16, 0.85);
      border: 1px dashed rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 12px 14px;
      margin-bottom: 22px;
      text-align: left;
    }

    .hwid-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .hwid-label {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #a855f7;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .hwid-val-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .hwid-text {
      font-family: var(--font-mono, monospace);
      font-size: 0.85rem;
      color: #e9d5ff;
      letter-spacing: 1px;
      user-select: all;
      font-weight: 600;
    }

    .btn-copy-hwid {
      background: rgba(168, 85, 247, 0.2);
      border: 1px solid rgba(168, 85, 247, 0.5);
      color: #d8b4fe;
      border-radius: 6px;
      padding: 4px 9px;
      font-size: 0.7rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s ease;
    }

    .btn-copy-hwid:hover {
      background: rgba(168, 85, 247, 0.4);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Key Input Section */
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .key-input-wrapper {
      position: relative;
    }

    .key-input {
      width: 100%;
      background: rgba(8, 2, 14, 0.95);
      border: 1.5px solid rgba(168, 85, 247, 0.4);
      border-radius: 12px;
      padding: 14px 16px;
      font-family: var(--font-mono, monospace);
      font-size: 0.95rem;
      color: #ffffff;
      letter-spacing: 1px;
      box-sizing: border-box;
      outline: none;
      transition: all 0.25s ease;
    }

    .key-input:focus {
      border-color: #c084fc;
      box-shadow: 0 0 16px rgba(168, 85, 247, 0.4);
    }

    .key-input::placeholder {
      color: #64748b;
      font-size: 0.82rem;
      font-family: var(--font-main, sans-serif);
      letter-spacing: 0;
    }

    /* Status Message */
    .status-msg {
      min-height: 22px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-top: 10px;
      letter-spacing: 0.3px;
      transition: all 0.2s ease;
    }

    /* Primary Unlock Button */
    .btn-unlock-room {
      width: 100%;
      background: linear-gradient(135deg, #a855f7 0%, #7e22ce 50%, #ea580c 100%);
      background-size: 200% 200%;
      border: none;
      border-radius: 12px;
      padding: 15px 20px;
      color: #ffffff;
      font-size: 0.95rem;
      font-weight: 800;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(168, 85, 247, 0.35);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-unlock-room:hover {
      background-position: right center;
      box-shadow: 0 8px 26px rgba(234, 88, 12, 0.45);
      transform: translateY(-2px);
    }

    .btn-unlock-room:active {
      transform: translateY(0);
    }

    .btn-unlock-room:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Divider */
    .gateway-divider {
      display: flex;
      align-items: center;
      margin: 24px 0 18px;
      color: #64748b;
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .gateway-divider::before,
    .gateway-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(168, 85, 247, 0.2);
    }

    .gateway-divider span {
      padding: 0 12px;
    }

    /* Discord Button */
    .btn-discord-join {
      width: 100%;
      background: rgba(88, 101, 242, 0.15);
      border: 1px solid rgba(88, 101, 242, 0.45);
      color: #c7d2fe;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-decoration: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-sizing: border-box;
      transition: all 0.25s ease;
    }

    .btn-discord-join:hover {
      background: rgba(88, 101, 242, 0.3);
      color: #ffffff;
      border-color: #818cf8;
      box-shadow: 0 4px 16px rgba(88, 101, 242, 0.3);
      transform: translateY(-1px);
    }

    /* Footer Meta */
    .gateway-footer {
      margin-top: 24px;
      font-size: 0.72rem;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    .gateway-footer a {
      color: #a855f7;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .gateway-footer a:hover {
      color: #c084fc;
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="ambient-glow-top"></div>

  <div class="gateway-container">
    <div class="gateway-card">
      <div class="gateway-logo-wrap">
        <img src="/assets/headless_dice_logo.png" alt="Headless Dice Logo">
      </div>

      <h1 class="gateway-title">🎃 HEADLESS DICE 🎃</h1>
      <div class="gateway-badges">
        <span class="badge-cyber" style="background: rgba(255,102,0,0.22); border-color: #ff7700; color: #ff9933;">🎃 HALLOWEEN EDITION</span>
        <span class="badge-sub" style="color: #e9d5ff;">10s HIGH-PRECISION PREDICTOR</span>
      </div>

      <!-- HWID Display Badge -->
      <div class="hwid-box">
        <div class="hwid-header">
          <span class="hwid-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
            Your Hardware ID (HWID)
          </span>
          <button type="button" class="btn-copy-hwid" id="btn-copy-hwid" title="Copy HWID to clipboard">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path></svg>
            <span id="copy-btn-text">COPY</span>
          </button>
        </div>
        <div class="hwid-val-row">
          <span class="hwid-text" id="hwid-display">DETECTING-HWID...</span>
        </div>
      </div>

      <!-- Key Input Form -->
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label" for="license-key-input">License Key / Access Key</label>
          <div class="key-input-wrapper">
            <input
              type="text"
              id="license-key-input"
              class="key-input"
              placeholder="Paste License Key (e.g. HD-VIP-XXXX-XXXX)..."
              autocomplete="off"
              spellcheck="false"
              required
            >
          </div>
          <div class="status-msg" id="gateway-status-msg"></div>
        </div>

        <button type="submit" class="btn-unlock-room" id="btn-unlock">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
          <span>🎃 UNLOCK & ENTER PREDICTOR ROOM</span>
        </button>
      </form>

      <div class="gateway-footer" style="justify-content: center; margin-top: 24px;">
        <span>Dedicated Room Predictor v1.0 • Encrypted Multi-User Protocol</span>
      </div>

      <div class="gateway-footer" style="justify-content: center;">
        <span>Dedicated Room Predictor v1.0 • Encrypted Multi-User Protocol</span>
      </div>
    </div>
  </div>

  <script>
    // Hardware ID (HWID) Management
    function getDeviceHwid() {
      let hwid = localStorage.getItem('headless_dice_hwid');
      if (!hwid) {
        const part1 = Math.floor(1000 + Math.random() * 9000);
        const part2 = Math.random().toString(36).substring(2, 6).toUpperCase();
        hwid = 'HD-HWID-' + part1 + '-' + part2;
        localStorage.setItem('headless_dice_hwid', hwid);
      }
      return hwid;
    }

    const currentHwid = getDeviceHwid();
    const hwidDisplay = document.getElementById('hwid-display');
    if (hwidDisplay) hwidDisplay.textContent = currentHwid;

    // Copy HWID Handler
    const copyBtn = document.getElementById('btn-copy-hwid');
    const copyText = document.getElementById('copy-btn-text');
    if (copyBtn) {
      copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(currentHwid).then(() => {
          if (copyText) copyText.textContent = 'COPIED!';
          setTimeout(() => {
            if (copyText) copyText.textContent = 'COPY';
          }, 2000);
        }).catch(() => {
          const fallback = prompt('Copy your HWID:', currentHwid);
        });
      });
    }

    // Login Submission Handler
    async function handleLoginSubmit(e) {
      if (e) e.preventDefault();
      const inputEl = document.getElementById('license-key-input');
      const statusEl = document.getElementById('gateway-status-msg');
      const submitBtn = document.getElementById('btn-unlock');

      const key = (inputEl.value || '').trim();
      if (!key) {
        if (statusEl) {
          statusEl.style.color = '#ef4444';
          statusEl.textContent = '⚠️ Please enter a license key.';
        }
        return;
      }

      if (statusEl) {
        statusEl.style.color = '#38bdf8';
        statusEl.textContent = '⚡ Securely verifying key with server...';
      }
      if (submitBtn) submitBtn.disabled = true;

      try {
        const res = await fetch('/api/verify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ key: key, hwid: currentHwid })
        });

        const data = await res.json();
        if (!data || !data.success) {
          if (statusEl) {
            statusEl.style.color = '#ef4444';
            statusEl.textContent = '❌ ' + (data.error || 'Invalid license key.');
          }
          if (submitBtn) submitBtn.disabled = false;
          return;
        }

        // Save authenticated session (always guarantee key and roomId are explicitly stored)
        const targetRoom = data.roomId || 'ROOM-' + currentHwid.slice(-4);
        data.key = key;
        data.roomId = targetRoom;
        localStorage.setItem('headless_dice_auth', JSON.stringify(data));
        sessionStorage.setItem('headless_dice_auth', JSON.stringify(data));

        if (statusEl) {
          statusEl.style.color = '#4ade80';
          if (data.role === 'OWNER') {
            statusEl.textContent = '⚡ Owner Privileges Verified! Opening Owner Command Center...';
          } else {
            statusEl.textContent = '⚡ Access Granted (' + (data.role || 'VIP') + ')! Redirecting to room ' + targetRoom + '...';
          }
        }

        setTimeout(() => {
          if (data.role === 'OWNER') {
            window.location.replace('/owner');
          } else {
            window.location.replace('/app?room=' + encodeURIComponent(targetRoom));
          }
        }, 500);
      } catch (err) {
        if (statusEl) {
          statusEl.style.color = '#ef4444';
          statusEl.textContent = '⚠️ Connection error: ' + err.message;
        }
        if (submitBtn) submitBtn.disabled = false;
      }
    }
  </script>
</body>
</html>
